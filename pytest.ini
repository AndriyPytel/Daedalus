[pytest]
testpaths = tests
faulthandler_timeout = 300
timeout = 300
timeout_method = thread
addopts = -n 8 --dist loadfile --max-worker-restart=0
markers =
    freecad: needs a real FreeCAD (Level 2); skipped when FreeCAD is not importable
    cadgenbench: needs the vendored CADGenBench scorer in its own venv; skipped when absent
    remote: runs against a deployed gateway; skipped without DAE_REMOTE_URL and DAE_REMOTE_TOKEN
