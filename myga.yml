stall_timeout_minutes: 10
max_attempts_per_ticket: 3

check:
  - pytest

tracker: youtrack
review_by: agent
external_tracking: false
permissions:
  # auto: commit after every change that leaves the tests green, without asking
  commit: allow
  merge_local: allow
  push: deny
  pull_request: deny
  deploy: deny
  run_tests: allow
  external_write: ask
articles:
  glossary: DAE-A-1
  features: DAE-A-2

models:
  default: anthropic/claude-opus-5
  developer: anthropic/claude-sonnet-5-5
  tester: anthropic/claude-sonnet-5-5
  worker: anthropic/claude-sonnet-5-5
  runner: anthropic/claude-haiku-4-5
  expert: anthropic/claude-fable-5

# YouTrack connection (migrated from youtrack.md)
youtrack:
  instance: https://andriipytel.youtrack.cloud
  organization: Personal Projects
  project: DAE
